<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ดูโมเดล AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; text-align: center; }
    model-viewer {
      width: 100%;
      height: 90vh;
      background-color: #f2f2f2;
    }
    h2 { margin: 10px; }
  </style>
</head>
<body>
  <h2>ส่องกล้องดูของเล่นในโลก AR</h2>

  <!-- เปลี่ยน "toy.glb" ให้ตรงกับชื่อไฟล์โมเดลของคุณ -->
  <model-viewer
    src="toy.glb"
    alt="โมเดล 3 มิติ"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
  >
    <button slot="ar-button" style="
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 16px;
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
      ">
      📱 ดูในโลกจริง (AR)
    </button>
  </model-viewer>

</body>
</html>
